name: CI-Linux

on: [push, pull_request, merge_group]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: docs - stable - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Install dependencies
        shell: bash
        run: |
          rustc --version
          cargo --version
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev

      # The gdal-sys build script does not rerun when the system GDAL changes,
      # so the GDAL version is part of the cache key.
      - name: Get GDAL version
        id: gdal
        shell: bash
        run: echo "version=$(gdal-config --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gdal-${{ steps.gdal.outputs.version }}

      - name: Format Check
        shell: bash
        run: cargo fmt --all -- --check

      - name: Clippy Check
        shell: bash
        run: cargo clippy --workspace --all-features --bins --examples --tests --benches -- -D warnings

      - name: Test Doc Build
        shell: bash
        # Make sure this list matches the members list in Cargo.toml
        run: |
          for package in geozero geozero-cli geozero-bench; do
            (echo "----- Testing doc build for package $package ----" && cargo doc -p $package --all-features --no-deps)
          done
        env:
          RUSTDOCFLAGS: "-D warnings"

  test:
    name: tests - stable - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports:
          - 34837:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Install dependencies
        shell: bash
        run: |
          rustc --version
          cargo --version
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev

      # The gdal-sys build script does not rerun when the system GDAL changes,
      # so the GDAL version is part of the cache key.
      - name: Get GDAL version
        id: gdal
        shell: bash
        run: echo "version=$(gdal-config --version)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gdal-${{ steps.gdal.outputs.version }}

      - name: Tests
        shell: bash
        run: |
          cargo test -p geozero
          cargo test -p geozero --no-default-features
          cargo test --workspace --all-features

      - name: PostGIS tests
        shell: bash
        run: |
          psql -P pager=off -v ON_ERROR_STOP=1 -f geozero/tests/data/postgis.sql $DATABASE_URL
          cargo test -p geozero --all-features -- --ignored postgis --test-threads 1
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:34837/test?sslmode=disable"

  coverage:
    name: coverage - stable - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    services:
      postgis:
        image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports:
          - 34837:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Install dependencies
        shell: bash
        run: |
          rustc --version
          cargo --version
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev gdal-bin

      - name: Prepare benchmark data
        shell: bash
        # The benches run against the small committed subsets in CI (CI=true):
        # the in-repo countries.fgb and buildings sample. Derive the shp/gpkg and
        # load the PostGIS tables the benches read.
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis"
          ogr2ogr -f PostgreSQL "PG:$DATABASE_URL" \
            geozero/tests/data/countries.fgb \
            -nln countries -lco GEOMETRY_NAME=geom -nlt PROMOTE_TO_MULTI
          sample=geozero-bench/tests/data/osm-buildings-3857-ch-sample
          ogr2ogr -f "ESRI Shapefile" -lco SPATIAL_INDEX=YES "$sample.shp" "$sample.fgb"
          ogr2ogr -f GPKG -nln buildings "$sample.gpkg" "$sample.fgb"
          ogr2ogr -f PostgreSQL "PG:$DATABASE_URL" "$sample.fgb" \
            -nln buildings -lco GEOMETRY_NAME=geom -nlt PROMOTE_TO_MULTI
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:34837/test?sslmode=disable"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        shell: bash
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --workspace --all-targets --all-features --include-build-script --codecov --output-path target/llvm-cov/codecov.info
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:34837/test?sslmode=disable"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/llvm-cov/codecov.info
          fail_ci_if_error: false
          
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Report inline annotations instead of uploading SARIF, so the job needs
          # no security-events: write and works for pull requests from forks.
          advanced-security: false
          annotations: true

  # This final step is needed to mark the whole workflow as successful
  # Don't change its name - it is used by the merge protection rules
  done:
    name: stable - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    needs: [ lint, test, zizmor ]
    if: always()
    permissions: {}
    steps:
      - name: Result of the needed steps
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        name: CI Result
        run: exit 1
